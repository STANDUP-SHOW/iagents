[package]
name = "iagent-watchdog"
description = "iAgent Box - surveillance des services reels : trois echecs en dix minutes deviennent une alerte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "iagent-watchdog"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[package.metadata.deb]
maintainer = "STANDUP-SHOW <contact@iagent.agency>"
copyright = "2026, STANDUP-SHOW"
extended-description = "Compte les relances (NRestarts) des services iAgent reels ; au troisieme echec en dix minutes, ecrit une alerte que iagent-device porte dans la telemetrie et dans le journal security."
section = "admin"
priority = "optional"
depends = "$auto, systemd"
assets = [["target/release/iagent-watchdog", "usr/bin/", "755"]]
