# Le cœur Rust de la Box (décision de max, 11/10/2026 : « Rust fait tourner la
# machine ») : l'identité et la signature partagées, l'agent de la Box, l'updater
# et le chien de garde. Un seul espace de travail, construit et éprouvé par
# `cargo test --manifest-path box/services/Cargo.toml` dans le job « box » de
# controles.yml ; les binaires deviennent des .deb par cargo-deb dans
# build-linux-deb.yml.
[workspace]
resolver = "2"
members = ["identite-box", "agent-device", "updater", "watchdog"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["STANDUP-SHOW"]
repository = "https://github.com/STANDUP-SHOW/iagents"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Ed25519 par ring, comme desktop/src-tauri/src/plateforme.rs : aucune bibliothèque de signature nouvelle.
ring = "0.17"
base64 = "0.22"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# HTTP bloquant, TLS rustls : un service système n'a pas besoin d'un exécuteur asynchrone.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
