# /etc/systemd/journald.conf.d/iagent.conf : the log convention of the brief (§39)
# is the SyslogIdentifier of each unit (device, runtime, browser, voice, update,
# security, factory) ; `journalctl -t update` is update.log. Kept thirty days on
# the encrypted DATA partition, never more than 500 MB. Nothing here is a secret:
# the services refuse to log one (iagent-device masks tokens before writing).
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=500M
MaxRetentionSec=30day
ForwardToSyslog=no
