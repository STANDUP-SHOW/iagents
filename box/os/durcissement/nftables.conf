#!/usr/sbin/nft -f
# iAgent OS: no inbound port, ever (brief §38). The Box only reaches out (https to
# the Control Plane, apt, DNS, NTP); everything inbound is dropped, except what the
# machine asks itself on the loopback (the factory page on 127.0.0.1:8787, the
# device socket) and the replies to its own connections.
flush ruleset
table inet iagent {
  chain entree {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    # ICMP / ICMPv6 needed for path MTU and neighbour discovery; nothing else inbound.
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
    ip6 nexthdr icmpv6 accept
  }
  chain transit {
    type filter hook forward priority 0; policy drop;
  }
  chain sortie {
    type filter hook output priority 0; policy accept;
  }
}
