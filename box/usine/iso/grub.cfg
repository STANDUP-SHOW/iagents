# Le menu de démarrage du Factory Installer : une seule entrée, qui part toute
# seule au bout de trois secondes et installe iAgent OS en effaçant le disque
# (brief §1 : l'opérateur branche, scanne, clique, attend). Une seule image pour
# toutes les Stations (max, 17/10/2026) : le profil (home, business, enterprise)
# se pose au provisioning, pas par la clé.
set timeout=3
set default=0
loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "iAgent Factory Installer - Station (EFFACE LE DISQUE, sans question)" {
  set gfxpayload=keep
  linux /casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/ quiet splash ---
  initrd /casper/initrd
}

menuentry "Verifier la memoire (memtest86+)" {
  linux /boot/memtest86+x64.efi
}
