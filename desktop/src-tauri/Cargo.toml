[package]
name = "iagent-desktop"
version = "0.1.0"
description = "iAgent Desktop — Local multi-agent orchestration with voice"
authors = ["STANDUP-SHOW"]
license = "MIT"
repository = "https://github.com/STANDUP-SHOW/iagents"
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
whisper-rs = "0.14"
hound = "3.5"
cpal = "0.17"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.30", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
imap = "2"
lettre = "0.11.23"
keyring = "3.6.3"
mailparse = "0.17.0"
native-tls = "0.2.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }
