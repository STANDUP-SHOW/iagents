[package]
name = "iagent-desktop"
version = "0.1.0"
description = "iAgent Desktop — Local multi-agent orchestration with voice"
authors = ["STANDUP-SHOW"]
license = "MIT"
repository = "https://github.com/STANDUP-SHOW/iagents"
edition = "2021"
rust-version = "1.70"
build = "build.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open", "dialog-open", "clipboard-write-text", "clipboard-read-text"] }
tokio = { version = "1", features = ["full"] }
vosk = "0.3"
hound = "3.5"
cpal = "0.17"
rubato = "0.13"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.30", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = "1.5"
