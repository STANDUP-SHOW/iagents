name: Build Factory ISO

# L'ISO du iAgent Box Factory Installer (brief §5) : une seule image pour toutes
# les Stations (max, 17/10/2026), nommée iagent-factory-installer-v<version>.iso,
# avec son manifeste (Build ID, commit, versions lues dans leurs fichiers). Le
# profil (home, business, enterprise) se pose au provisioning, pas par la clé.
# Elle embarque les .deb construits par build-linux-deb.yml ; l'ISO Ubuntu
# 24.04.5 source est vérifiée contre box/usine/iso/source.json et gardée en cache
# par son condensé.
#
# Lancé à la main ou sur une étiquette box-v* : trois gigaoctets ne se
# téléchargent pas à chaque PR. Sur une PR, controles.yml joue
# `construire-iso.sh --verifier`, qui assemble l'arbre nocloud/ et le manifeste
# sans ISO. L'essai QEMU (essayer-qemu.sh) ne tourne pas ici : les runners
# hébergés n'exposent pas KVM ; c'est l'étape « VM » de box/README.md.
on:
  push:
    tags:
      - 'box-v*'
  workflow_dispatch:
    inputs:
      plateforme:
        description: "Adresse https du Control Plane à graver dans l'ISO (vide : l'enrôlement attendra une adresse)"
        default: ""

jobs:
  paquets:
    name: Paquets .deb (réutilise build-linux-deb.yml)
    uses: ./.github/workflows/build-linux-deb.yml

  iso:
    name: ISO de la Station
    needs: paquets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Outils d'assemblage
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xorriso curl

      - uses: actions/download-artifact@v4
        with:
          pattern: iagent-*-deb
          path: paquets
          merge-multiple: true

      - name: L'écran opérateur (statique)
        run: npm --prefix box/usine/ui install --no-audit --no-fund && npm --prefix box/usine/ui run build

      # L'ISO Ubuntu source, gardée par son condensé : un changement de source.json la retélécharge.
      - name: Lire source.json
        id: source
        run: |
          echo "fichier=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("box/usine/iso/source.json","utf8")).fichier)')" >> "$GITHUB_OUTPUT"
          echo "sha=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("box/usine/iso/source.json","utf8")).sha256)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: dist/${{ steps.source.outputs.fichier }}
          key: ubuntu-iso-${{ steps.source.outputs.sha }}

      - name: Construire l'ISO
        run: |
          mkdir -p dist
          box/usine/iso/construire-iso.sh --paquets paquets --sortie dist \
            --plateforme "${{ github.event.inputs.plateforme }}" --operateur "flux GitHub ${{ github.run_number }}"
          rm -f "dist/${{ steps.source.outputs.fichier }}.partiel"
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: iagent-factory-installer
          path: |
            dist/iagent-factory-installer-*.iso
            dist/iagent-factory-installer-*.iso.sha256
            dist/manifeste.json
          retention-days: 14
