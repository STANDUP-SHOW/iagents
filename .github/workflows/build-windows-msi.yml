name: Build Windows MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # vosk-sys declares `#[link(name = "libvosk")]` and ships no build script,
      # so the import library has to be on the linker's search path before cargo
      # runs. The asset name carries the version, so resolve it at build time.
      - name: Fetch the Vosk native library
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent'  = 'iagents-ci'
          }
          $releases = Invoke-RestMethod -Headers $headers `
            -Uri 'https://api.github.com/repos/alphacep/vosk-api/releases?per_page=20'
          $asset = $releases |
            ForEach-Object { $_.assets } |
            Where-Object { $_.name -like 'vosk-win64-*.zip' } |
            Select-Object -First 1
          if (-not $asset) {
            throw 'No vosk-win64-*.zip asset found in the vosk-api releases.'
          }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile vosk.zip
          Expand-Archive -Path vosk.zip -DestinationPath vosk -Force
          $libDir = (Get-ChildItem vosk -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$libDir\libvosk.lib")) {
            throw "libvosk.lib not found under $libDir"
          }
          "VOSK_LIB_DIR=$libDir"   >> $env:GITHUB_ENV
          "LIB=$libDir;$env:LIB"   >> $env:GITHUB_ENV
          "RUSTFLAGS=-L $libDir"   >> $env:GITHUB_ENV
          $libDir >> $env:GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build:web

      # `npm run build` is `tauri build`, which re-runs build:web through
      # beforeBuildCommand and then bundles the MSI and the NSIS installer.
      - name: Build Tauri app
        run: npm run build

      - name: Locate the installers
        id: msi
        shell: pwsh
        run: |
          $bundle = 'src-tauri\target\release\bundle'
          $msi = Get-ChildItem "$bundle\msi\*.msi" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $msi) {
            Get-ChildItem $bundle -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            throw 'The build produced no .msi file.'
          }
          Write-Host "MSI : $($msi.FullName) ($([math]::Round($msi.Length / 1MB, 2)) MB)"
          "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "msi_name=$($msi.Name)"     >> $env:GITHUB_OUTPUT

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: iagent-desktop-installers
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
