name: Build Windows MSI

on:
  # Sur chaque PR qui touche l'application : sans ça, on n'apprend qu'une
  # compilation est cassée qu'au moment d'étiqueter une version.
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-msi.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Une nouvelle poussée rend la précédente sans objet : l'annuler évite des
# échecs trompeurs remontés sur d'anciens commits.
concurrency:
  group: msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    # Écrire une Release sur une étiquette ; rien d'autre n'écrit dans le dépôt.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: desktop

      # Signature des installeurs par Azure Artifact Signing, sur une étiquette
      # seulement et quand les secrets et variables AZURE_* / IAGENT_SIGNATURE_*
      # sont posés (voir desktop/SIGNATURE-WINDOWS.md). Sans eux, rien ne
      # s'installe et la construction reste non signée.
      - name: Install signing tool
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          IAGENT_SIGNATURE_POINT: ${{ vars.IAGENT_SIGNATURE_POINT }}
          IAGENT_SIGNATURE_COMPTE: ${{ vars.IAGENT_SIGNATURE_COMPTE }}
          IAGENT_SIGNATURE_PROFIL: ${{ vars.IAGENT_SIGNATURE_PROFIL }}
        run: |
          if node signature-windows.mjs actif; then
            cargo install artifact-signing-cli --locked
          else
            echo "Signature Windows non configurée : installeurs non signés."
          fi
        working-directory: desktop

      # Construit l'interface puis empaquette : tauri build enchaîne lui-même
      # le build Vite via beforeBuildCommand.
      #
      # Sur une étiquette v1.2.3, et seulement là, la construction devient une
      # version signée que les postes installent d'eux-mêmes : la clé privée
      # (secrets du dépôt) signe l'installeur, la clé publique et l'adresse du
      # manifeste (variables du dépôt) entrent dans l'application. Sans eux,
      # construction ordinaire ; avec une partie seulement, échec qui nomme ce
      # qui manque. Voir desktop/MISES-A-JOUR.md.
      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          IAGENT_MAJ_CLE_PUBLIQUE: ${{ vars.IAGENT_MAJ_CLE_PUBLIQUE }}
          IAGENT_MAJ_ADRESSE: ${{ vars.IAGENT_MAJ_ADRESSE }}
          AZURE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/') && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.AZURE_TENANT_ID || '' }}
          IAGENT_SIGNATURE_POINT: ${{ vars.IAGENT_SIGNATURE_POINT }}
          IAGENT_SIGNATURE_COMPTE: ${{ vars.IAGENT_SIGNATURE_COMPTE }}
          IAGENT_SIGNATURE_PROFIL: ${{ vars.IAGENT_SIGNATURE_PROFIL }}
        run: |
          CONF=$(node version-signee.mjs config)
          CONF=$(node signature-windows.mjs config "$CONF")
          if [ -n "$CONF" ]; then
            echo "Réglages de construction : $CONF"
            npm run build -- --config "$CONF"
            node version-signee.mjs manifeste
          else
            npm run build
          fi
        working-directory: desktop

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: iagent-desktop-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # Les postes s'installent avec l'installeur NSIS (par utilisateur, sans
      # administrateur) : c'est ce qui permet ensuite de les mettre à jour sans
      # que personne n'ait à cliquer. Le MSI reste pour un parc d'entreprise.
      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: iagent-desktop-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      # Ce qu'il faut déposer à l'adresse de IAGENT_MAJ_ADRESSE : latest.json et
      # l'installeur signé. Rien n'est publié d'ici : où ces fichiers vivent est
      # une décision à part.
      - name: Upload update artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: iagent-desktop-mise-a-jour
          path: desktop/mise-a-jour/
          if-no-files-found: ignore
          retention-days: 90

      # Noms stables : le bouton de iagent.agency pointe sur
      #   https://github.com/STANDUP-SHOW/iagents/releases/latest/download/iAgent-Windows-setup.exe
      #   https://github.com/STANDUP-SHOW/iagents/releases/latest/download/iAgent-Windows.msi
      # et, pour les postes, .../releases/latest/download/latest.json.
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p publication
          cp desktop/src-tauri/target/release/bundle/msi/*.msi publication/iAgent-Windows.msi
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe publication/iAgent-Windows-setup.exe
          if [ -d desktop/mise-a-jour ]; then cp desktop/mise-a-jour/* publication/; fi
          ls -l publication

      # Une Release publiée est publique : le dépôt l'est. Tant que la variable
      # du dépôt IAGENT_PUBLIER_RELEASES ne vaut pas « oui », la Release reste
      # un brouillon que personne d'autre ne voit, et releases/latest ne la
      # sert pas. La passer à « oui » est la décision de rendre le produit
      # téléchargeable par tout visiteur.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publication/*
          draft: ${{ vars.IAGENT_PUBLIER_RELEASES != 'oui' }}
          make_latest: true
