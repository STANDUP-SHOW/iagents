name: Build Windows MSI

on:
  # Sur chaque PR qui touche l'application : sans ça, on n'apprend qu'une
  # compilation est cassée qu'au moment d'étiqueter une version.
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-msi.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: desktop

      # Construit l'interface puis empaquette : tauri build enchaîne lui-même
      # le build Vite via beforeBuildCommand.
      - name: Build Tauri app
        run: npm run build
        working-directory: desktop

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: iagent-desktop-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/msi/*.msi
          draft: true
