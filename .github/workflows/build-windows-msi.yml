name: Build Windows MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd desktop
          npm install
      
      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
      
      - name: Build Tauri app
        run: |
          cd desktop
          npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      
      - name: Find MSI file
        id: msi
        run: |
          $msiFile = Get-Item "desktop\src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue
          if ($msiFile) {
            echo "msi_path=$($msiFile.FullName)" >> $env:GITHUB_OUTPUT
            echo "msi_name=$($msiFile.Name)" >> $env:GITHUB_OUTPUT
            echo "msi_size=$([math]::Round($msiFile.Length / 1MB, 2)) MB" >> $env:GITHUB_OUTPUT
          }
      
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: iagent-desktop-msi
          path: desktop/src-tauri/target/release/bundle/msi/
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: desktop/src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
