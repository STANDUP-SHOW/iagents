name: Contrôles

# Le seul flux qui existait construisait le MSI et rien d'autre : aucun banc ne
# tournait en intégration continue. Les gardes de ce dépôt — dimensionnement,
# économie, paquets, logiciels, connecteurs, application, boutique — ne
# protégeaient donc que la machine de qui pensait à les lancer. Un garde que
# personne ne lance ne protège de rien.
on:
  # Sans filtre de chemins, volontairement : les fautes trouvées le 23/09 (un
  # compte d'appels faux, une table d'économie périmée, une fiche exigeant une
  # application qui n'existe pas) vivaient toutes hors de desktop/.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  donnees:
    name: Données, fiches et boutique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, pas 20 : les bancs se lancent avec --experimental-strip-types, qui
      # n'existe qu'a partir de Node 22.6. Le flux du MSI tient avec 20 parce
      # qu'il n'appelle que Vite et Tauri. Premiere execution de ce flux, le
      # 23/09 : « node: bad option: --experimental-strip-types », sortie 9.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer
        run: npm install

      # Dimensionnement, économie (dont la fraîcheur de docs/economie*.md),
      # paquets, logiciels, activités, connecteurs, agents, consignes,
      # entretien, courriel, embauche, travail.
      - name: Contrôle des données
        run: npm run controle

      - name: Typage à la racine
        run: npx tsc --noEmit

      # Rend réellement les pages de la boutique en SSR, tous onglets :
      # « vite build » ne voit pas une variable qui n'existe pas.
      - name: Contrôle de la boutique
        run: npm run controle-boutique

      # La plateforme dans le vrai moteur de Cloudflare (workerd, par wrangler
      # dev, sans compte ni réseau) : stockage qui survit au redémarrage, fiches
      # lues avec leurs octets exacts, tarifs identiques à Node, flux
      # téléphonique ouvert. Les bancs des modules tournent sous Node dans
      # « Contrôle des données » ; celui-ci ne voit que ce que la porte
      # Cloudflare peut casser.
      - name: Plateforme dans le moteur de Cloudflare
        run: npm run controle-cloudflare

      # Le seul relevé que ce dépôt ne peut pas faire ailleurs : les binaires du
      # moteur de voix Piper sont publiés dans les versions de GitHub, et la
      # session qui a écrit le téléchargement de la voix ne joint pas
      # github.com. Ce flux, lui, TOURNE chez GitHub. Tant que le moteur n'est
      # pas déclaré, l'étape imprime ce qu'il faudrait écrire sans rien faire
      # échouer ; une fois déclaré, elle refuse une version qui a bougé chez
      # l'éditeur — vu ici plutôt que chez le client au moment où il clique.
      - name: Relevé du moteur de voix chez l'éditeur
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types desktop/relever-piper.ts

  box:
    name: Box (usine, services, écran opérateur)
    # 24.04 et non -latest : c'est l'Ubuntu d'iAgent OS (box/usine/iso/source.json),
    # et les .deb des services se construisent contre sa glibc.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer
        run: npm install

      # Les bancs TypeScript du dossier box/ tournent déjà dans « Contrôle des
      # données » (npm run controle). Ici : ce que seul Linux peut voir.
      - name: Scripts shell (shellcheck)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck xorriso
          find box -name '*.sh' -print0 | xargs -0 shellcheck -S warning

      - name: Tests d'usine Python (règles pures, témoins)
        run: python3 -m unittest discover -s box/usine/tests -v

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: box/services
      - name: Services Rust de la Box (cargo test)
        run: cargo test --manifest-path box/services/Cargo.toml --workspace

      - name: Écran opérateur (rendu SSR des écrans sur les rapports témoins)
        run: npm --prefix box/usine/ui install --no-audit --no-fund && npm --prefix box/usine/ui run banc

      # Assemble l'arbre nocloud/ et le manifeste sans télécharger l'ISO Ubuntu :
      # une faute de chemin dans construire-iso.sh se voit ici, pas à l'étiquette.
      - name: Assemblage de l'ISO à blanc (--verifier)
        run: |
          box/usine/iso/construire-iso.sh --profil business --sortie dist --verifier
          box/usine/iso/construire-iso.sh --profil home --sortie dist --verifier
          cat dist/arbre-nocloud-business.txt | head -40

  application:
    name: Application desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La liste vit dans desktop/dependances-systeme.txt et nulle part
      # ailleurs. Recopiée ici, elle a perdu deux paquets sur sept a sa
      # premiere execution : apt reussissait, et cargo s'arretait plus loin sur
      # `alsa-sys`. Une etape verte ne prouve que ce qu'elle regarde.
      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          grep -v '^[[:space:]]*\(#\|$\)' desktop/dependances-systeme.txt \
            | xargs sudo apt-get install -y --no-install-recommends

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # 22, pas 20 : les bancs se lancent avec --experimental-strip-types, qui
      # n'existe qu'a partir de Node 22.6. Le flux du MSI tient avec 20 parce
      # qu'il n'appelle que Vite et Tauri. Premiere execution de ce flux, le
      # 23/09 : « node: bad option: --experimental-strip-types », sortie 9.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Le chemin Windows de la jauge (GlobalMemoryStatusEx) ne se compile pas
      # ici : c'est le flux « Build Windows MSI » qui le vérifie.
      - name: Typage de l'interface et bancs Rust
        run: npm run controle-application
