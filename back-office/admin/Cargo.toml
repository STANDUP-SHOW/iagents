[package]
name = "iagent-back-office-admin"
version = "0.1.0"
description = "Appel des routes admin et public de la plateforme iAgent, jeton au trousseau du systeme. Partage par l'application Back-office et, a terme, le Desktop Commander."
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Same major as desktop/src-tauri (0.11, native TLS): one HTTP stack for the
# whole product.
reqwest = { version = "0.11", features = ["json"] }
# Same version as desktop/src-tauri. The native stores are switched on HERE:
# without a feature, keyring 3 falls back to an in-memory mock and the token
# would vanish when the app closes (see the report: desktop/ has that gap).
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# E-mail studio (src/courriel.rs): SMTP over TLS to the OVH mailbox, the
# fingerprint of the draft that was read, and the portraits converted to JPEG.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-native-tls"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
